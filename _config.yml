# Site
name: "Unpack Leadership"
title: "Lead Yourself. Lead Others. Lead Teams. Lead Across Cultures."
description: "Leadership development and intercultural communication insights from Matt Gates."
logo: 'assets/images/logo-placeholder.svg'
favicon: 'assets/images/logo-placeholder.svg'
baseurl: ""
google_analytics: ''
include: ["_pages"]
permalink: /:title/

# Author
author:
  name: Matt Gates
  location: "Vancouver, Canada"
  email: matt.gates65@gmail.com
  headline: "Lead Yourself. Lead Others. Lead Teams. Lead Across Cultures."
  roles_line1: "Leadership Development · Intercultural Communication"
  roles_line2: "Coaching · AI and the Future of Work"
  bio: "I help leaders and teams build the self-awareness, coaching skills, and cross-cultural fluency they need to lead well in a connected world."

# Social links (replace youtube placeholder with your real profile URL when ready)
social:
  linkedin: "https://www.linkedin.com/in/mattygates/"
  youtube: "#"
  ppc_linkedin: "https://www.linkedin.com/company/peakpotentialconsulting/"
  ppc_website: "https://www.peakpotentialconsulting.com/"

# Authors (used by post front matter, kept for compatibility with existing posts)
authors:
  matt:
    name: matt
    display_name: Matt Gates
    avatar: 'assets/images/Matt_aboutpic.png'
    email: matt.gates65@gmail.com
    web: https://unpackleadership.com
    description: "Leadership development and intercultural communication. Based in Vancouver, Canada."

# The four content pillars — shown in the homepage topic grid and used as post categories
topics:
  - name: "Lead Self"
    slug: "lead-self"
    description: "Lead yourself with greater awareness, judgment, adaptability and emotional intelligence."
  - name: "Lead Others"
    slug: "lead-others"
    description: "Build stronger one-to-one leadership through feedback, coaching, influence, trust, accountability and difficult conversations."
  - name: "Lead Teams"
    slug: "lead-teams"
    description: "Create the conditions for teams to collaborate, make decisions, handle conflict, take ownership and perform well together."
  - name: "Lead Across Cultures"
    slug: "lead-across-cultures"
    description: "Lead effectively across cultural differences through cultural intelligence, intercultural communication, trust and global-team leadership."

# Plugins
plugins:
  - jekyll-paginate-v2
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

# Pagination V2 (master switch must stay true; only pages with
# `pagination: enabled: true` in their own front matter actually get paginated — that's /articles/)
pagination:
  enabled: true
  per_page: 9
  permalink: '/page:num/'
  title: ':title - page :num'
  limit: 0
  sort_field: 'date'
  sort_reverse: true

# Other
markdown: kramdown

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

exclude: [changelog.md, LICENSE.txt, README.md, Gemfile, Gemfile.lock]
