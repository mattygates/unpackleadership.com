---
layout: default
---

<div class="page-header">
  <div class="wrap">
    <h1>{{ page.title }}</h1>
    <p class="hero-roles">{{ site.author.roles }}</p>
  </div>
</div>

<div class="about-page">
  <div class="wrap">
    <div class="about-page-figure">
      <img src="{{ site.baseurl }}/assets/images/Matt_aboutpic.png" alt="Matt Gates">
    </div>

    <div class="prose">
      {{ content }}
    </div>
  </div>
</div>

<section class="section section-alt about-connect">
  <div class="wrap">
    <span class="section-eyebrow">Connect</span>
    <h2>Let's Connect</h2>

    <div class="connect-links">
      <a class="connect-link" href="{{ site.social.linkedin }}" target="_blank" rel="noopener">
        <span class="connect-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path><rect x="2" y="9" width="4" height="12"></rect><circle cx="4" cy="4" r="2"></circle></svg>
        </span>
        <span class="connect-text">
          <strong>Matt Gates</strong>
          <small>Personal LinkedIn</small>
        </span>
      </a>

      <a class="connect-link" href="{{ site.social.ppc_linkedin }}" target="_blank" rel="noopener">
        <span class="connect-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path><rect x="2" y="9" width="4" height="12"></rect><circle cx="4" cy="4" r="2"></circle></svg>
        </span>
        <span class="connect-text">
          <strong>Peak Potential Consulting</strong>
          <small>Company LinkedIn</small>
        </span>
      </a>

      <a class="connect-link" href="{{ site.social.ppc_website }}" target="_blank" rel="noopener">
        <span class="connect-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
        </span>
        <span class="connect-text">
          <strong>Peak Potential Consulting</strong>
          <small>Website</small>
        </span>
      </a>
    </div>
  </div>
</section>
