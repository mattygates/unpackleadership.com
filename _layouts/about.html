---
layout: default
---

<div class="page-header">
  <div class="wrap">
    <h1>{{ page.title }}</h1>
    <p class="hero-roles">{{ site.author.roles }}</p>
  </div>
</div>

<div class="about-page">
  <div class="wrap">
    <div class="about-page-figure">
      <img src="{{ site.baseurl }}/assets/images/Matt_aboutpic.png" alt="Matt Gates">
    </div>

    <div class="prose">
      {{ content }}
    </div>
  </div>
</div>

<section class="section section-alt about-connect">
  <div class="wrap">
    <span class="section-eyebrow">Connect</span>
    <h2>Let's Connect</h2>

    <div class="connect-links">
      <a class="connect-link" href="{{ site.social.linkedin }}" target="_blank" rel="noopener">
        <span class="connect-icon">
          <svg width="16" height="16" viewBox="0 0 448 512" fill="currentColor"><path d="M100.28 448H7.4V148.9h92.88zM53.79 108.1C24.09 108.1 0 83.5 0 53.8a53.79 53.79 0 0 1 107.58 0c0 29.7-24.1 54.3-53.79 54.3zM447.9 448h-92.68V302.4c0-34.7-.7-79.2-48.29-79.2-48.29 0-55.69 37.7-55.69 76.7V448h-92.78V148.9h89.08v40.8h1.3c12.4-23.5 42.69-48.3 87.88-48.3 94 0 111.28 61.9 111.28 142.3V448z"></path></svg>
        </span>
        <span class="connect-text">
          <strong>Matt Gates</strong>
          <small>Personal LinkedIn</small>
        </span>
      </a>

      <a class="connect-link" href="{{ site.social.ppc_linkedin }}" target="_blank" rel="noopener">
        <span class="connect-icon">
          <svg width="16" height="16" viewBox="0 0 448 512" fill="currentColor"><path d="M100.28 448H7.4V148.9h92.88zM53.79 108.1C24.09 108.1 0 83.5 0 53.8a53.79 53.79 0 0 1 107.58 0c0 29.7-24.1 54.3-53.79 54.3zM447.9 448h-92.68V302.4c0-34.7-.7-79.2-48.29-79.2-48.29 0-55.69 37.7-55.69 76.7V448h-92.78V148.9h89.08v40.8h1.3c12.4-23.5 42.69-48.3 87.88-48.3 94 0 111.28 61.9 111.28 142.3V448z"></path></svg>
        </span>
        <span class="connect-text">
          <strong>Peak Potential Consulting</strong>
          <small>Company LinkedIn</small>
        </span>
      </a>

      <a class="connect-link" href="{{ site.social.ppc_website }}" target="_blank" rel="noopener">
        <span class="connect-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
        </span>
        <span class="connect-text">
          <strong>Peak Potential Consulting</strong>
          <small>Website</small>
        </span>
      </a>
    </div>
  </div>
</section>
