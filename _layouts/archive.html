---
layout: default
---

<div class="wrap">
  {% include breadcrumbs.html trail="Home|/" current=page.title %}
</div>

<div class="page-header">
  <div class="wrap">
    <h1>{{ page.title }}</h1>
  </div>
</div>

<section class="section">
  <div class="wrap">
    <div class="card-grid">
      {% for post in paginator.posts %}
        {% include postbox.html post=post %}
      {% endfor %}
    </div>

    {% include pagination.html %}
  </div>
</section>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {% include json-ld-organization.html %},
    {% include json-ld-person.html %},
    {% include json-ld-ppc.html %},
    {% include json-ld-website.html %},
    {
      "@type": "CollectionPage",
      "@id": "{{ page.url | absolute_url }}#collectionpage",
      "url": "{{ page.url | absolute_url }}",
      "name": {{ page.title | jsonify }},
      "description": {{ page.description | jsonify }},
      "isPartOf": { "@id": "{{ site.url }}/#website" },
      "breadcrumb": { "@id": "{{ page.url | absolute_url }}#breadcrumb" }
    },
    {% include breadcrumb-jsonld.html trail="Home|/" current=page.title page_url=page.url %}
  ]
}
</script>
