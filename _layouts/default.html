<!DOCTYPE html>
<html lang="en">
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-4JCSG9ZY27"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-4JCSG9ZY27');
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

<link rel="icon" href="{{ site.baseurl }}/{{ site.favicon }}">

<title>{% if page.seo_title %}{{ page.seo_title }}{% elsif page.title %}{{ page.title }} | {{ site.name }}{% else %}{{ site.name }}{% endif %}</title>
{% if page.keywords %}
<meta name="keywords" content="{{ page.keywords | join: ', ' }}">
{% endif %}

{% seo title=false %}

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "@id": "{{ site.url }}/about/#person",
  "name": "Matt Gates",
  "url": "{{ site.url }}/about/",
  "image": "{{ site.url }}/assets/images/matt-gates-office-vancouver-2026.png",
  "jobTitle": [
    "Leadership Development Consultant",
    "Leadership Coach",
    "Intercultural Communication Specialist"
  ],
  "homeLocation": {
    "@type": "Place",
    "name": "Vancouver, Canada"
  },
  "worksFor": {
    "@type": "Organization",
    "name": "Peak Potential Consulting",
    "url": "{{ site.social.ppc_website }}",
    "sameAs": "{{ site.social.ppc_linkedin }}"
  },
  "sameAs": [
    "{{ site.social.linkedin }}",
    "{{ site.social.youtube }}",
    "{{ site.social.ppc_website }}"
  ],
  "knowsAbout": [
    "Leadership development",
    "Cross-cultural communication",
    "Intercultural communication",
    "Leadership coaching",
    "Executive coaching",
    "Feedback and accountability",
    "Multicultural teams",
    "Global teams",
    "AI literacy for leaders"
  ]
}
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:ital@1&display=swap" rel="stylesheet">

<link href="{{ site.baseurl }}/assets/css/main.css?v={{ site.time | date: '%s' }}" rel="stylesheet">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ site.baseurl }}/">
      <img src="{{ site.baseurl }}/{{ site.logo }}" alt="{{ site.name }} logo">
      <span>{{ site.name }}</span>
    </a>

    <nav class="main-nav" aria-label="Primary">
      <a href="{{ site.baseurl }}/"{% if page.url == "/" %} class="active"{% endif %}>Home</a>
      <a href="{{ site.baseurl }}/about/"{% if page.url contains "/about" %} class="active"{% endif %}>About</a>
      <a href="{{ site.baseurl }}/articles/"{% if page.url contains "/articles" %} class="active"{% endif %}>Articles</a>
      <a href="{{ site.baseurl }}/videos/"{% if page.url contains "/videos" %} class="active"{% endif %}>Videos</a>
    </nav>

    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false"><span></span></button>
  </div>
</header>

<main>
  {{ content }}
</main>

<footer class="site-footer">
  <div class="wrap">
    <nav class="footer-links" aria-label="Footer navigation">
      <a href="{{ site.baseurl }}/">Home</a>
      <a href="{{ site.baseurl }}/about/">About</a>
      <a href="{{ site.baseurl }}/articles/">Articles</a>
      <a href="{{ site.baseurl }}/feed.xml">RSS</a>
      <a href="{{ site.social.ppc_website }}" target="_blank" rel="noopener">Peak Potential Consulting</a>
    </nav>

    <div class="footer-identity">
      <span>Matt Gates</span>
      <span>Vancouver</span>
      <span>Lead Yourself</span>
      <span>Lead Others</span>
      <span>Lead Across Cultures</span>
    </div>
  </div>
</footer>

<script src="{{ site.baseurl }}/assets/js/main.js"></script>

</body>
</html>
